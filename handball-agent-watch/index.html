<body>
    <div id="top-bar">
        <div class="stat-group">
            <div class="stat-box">
                <span class="label">Rank</span>
                <span id="player-rank" class="value">Jack</span>
            </div>
            <div class="stat-box">
                <span class="label">Ace Time</span>
                <span id="ace-time" class="value">00:00</span>
            </div>
        </div>

        <button id="change-name-btn" class="small-btn">Change Name</button>

        <div class="stat-box">
            <span class="label">Best Time</span>
            <span id="best-time" class="value">--:--</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Handball</h1>
            <p>Use WASD or Arrow Keys to Move</p>
            <p>Click or Space to Hit</p>
            <p>Don't let the ball bounce twice in your square!</p>
            <input type="text" id="player-name-input" placeholder="Enter Your Name" maxlength="10">
            <button id="start-btn">Play Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>Your Final Rank: <span id="final-rank">Jack</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    <script src="game_v14.js"></script>
    <script src="agent-autoplay.js"></script>
